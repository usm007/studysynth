<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e4634">
<title>CTET Mock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body class="player">
<header id="playerBar">
  <a id="playerBack" href="index.html" aria-label="Back to the library">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Library</span>
  </a>
  <h1 id="playerTitle">Mock paper</h1>
  <button id="playerOpen" type="button" aria-label="Open this paper in a new tab">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</header>

<iframe id="playerFrame" title="Mock paper" allow="fullscreen"></iframe>

<section id="playerError" hidden>
  <h2>This paper could not be opened</h2>
  <p>It may not be cached on this device yet. Open it in a new tab, or go back and try again once the library has finished downloading.</p>
  <button id="playerRetry" class="btn" type="button">Try again</button>
  <a id="playerOpenLink" class="btn btn-secondary" href="#">Open in a new tab</a>
  <a class="btn btn-secondary" href="index.html">Back to the library</a>
</section>

<script src="player.js"></script>
</body>
</html>
